server {
    listen 80;
    listen [::]:80;

    server_name ai.codev.academy;

    access_log /var/log/nginx/ai.codev.academy.access.log;
    error_log  /var/log/nginx/ai.codev.academy.error.log warn;

    client_max_body_size 25m;

    # Cloudflare Tunnel terminates public HTTPS and connects to this origin over HTTP.
    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;

        # Preserve Cloudflare request metadata for logs and application middleware.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # Harmless for normal HTTP and keeps the proxy ready for WebSocket upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
